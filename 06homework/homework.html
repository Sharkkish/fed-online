<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <link rel="stylesheet" href="./homework.css">
</head>
<body>
    <div class="container">
        <button>
            <img src="./image/Vector.png" alt="Menu">
        </button>

        <h1>Menu</h1>

        <form>
            <input placeholder="Search food here" type="text">
        </form>

        <div class="categories">
            <div class="category active">
                <img src="image/image 4.png" alt="Food">
                <p>Food</p>
            </div>

            <div class="category">
                <img src="image/Group 5.png" alt="Sweet">
                <p>Sweet</p>
            </div>

            <div class="category">
                <img src="image/Group 6.png" alt="Drinks">
                <p>Drinks</p>
            </div>
        </div>

        <h2>Burgers</h2>

        <div class="burger-card">
            <img src="./image/Big-tasty.png" alt="Big tasty">
            <div class="burger-info">
                <p class="burger-name">Big tasty</p>
                <p class="burger-price">$10</p>
            </div>
        </div>

        <div class="burger-card">
            <img src="./image/chicken burger.png" alt="Chicken burger">
            <div class="burger-info">
                <p class="burger-name">Chicken burger</p>
                <p class="burger-price">$12</p>
            </div>
        </div>

        <div class="burger-card">
            <img src="./image/Junior Burger.png" alt="Junior Burger">
            <div class="burger-info">
                <p class="burger-name">Junior Burger</p>
                <p class="burger-price">$11</p>
            </div>
        </div>
    </div>
</body>
</html>
