<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./homework.css">
</head>
<body>

<div class="main_structure">

    <img class="Logo" src="./image/Group 1.png" alt="Logo">

    <div class="menu_title">Menu</div>

    <div class="search_area">
        <input type="text" placeholder="Search food here">
        <img src="./image/food.png" alt="Food">
        <img src="./image/sweet.png" alt="Sweet">
        <img src="./image/drinks.png" alt="Drinks">
    </div>

    <div class="Burgers">Burgers</div>

    <div class="Burgers_images">

        <div class="Burger_card">
            <img src="./image/Big-tasty.png" alt="Burger">

            <div class="burger_info">
                <p class="burger_name">Big tasty</p>
                <p class="burger_price">$10</p>
            </div>
        </div>

        <div class="Burger_card">
            <img src="./image/chicken burger.png" alt="Burger">

            <div class="burger_info">
                <p class="burger_name">Chicken burger</p>
                <p class="burger_price">$12</p>
            </div>
        </div>

        <div class="Burger_card">
            <img src="./image/Junior Burger.png" alt="Burger">

            <div class="burger_info">
                <p class="burger_name">Junior Burger</p>
                <p class="burger_price">$11</p>
            </div>
        </div>

    </div>

</div>

</body>
</html>
